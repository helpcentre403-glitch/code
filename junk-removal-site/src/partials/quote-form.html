<section id="quote" class="section quote-section" aria-labelledby="quote-h">
  <div class="container narrow">
    <div class="card form-card">
      <h2 id="quote-h">Get your free quote</h2>
      <p class="muted">Takes about a minute. We reply by text.</p>
      <form id="quote-form" data-max-files="{{ maxFiles }}" data-max-bytes="{{ maxBytes }}" action="/api/lead" method="POST" enctype="multipart/form-data" novalidate>
        <div class="form-summary" id="form-summary" role="alert" tabindex="-1" hidden></div>

        <div class="field">
          <label for="f-name">Name <span class="req" aria-hidden="true">*</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="100" aria-describedby="e-name">
          <p class="error" id="e-name" data-for="name"></p>
        </div>

        <div class="field">
          <label for="f-phone">Mobile phone <span class="req" aria-hidden="true">*</span></label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="(214) 555-0123" aria-describedby="e-phone">
          <p class="error" id="e-phone" data-for="phone"></p>
        </div>

        <div class="field">
          <label for="f-zip">ZIP code <span class="req" aria-hidden="true">*</span></label>
          <input id="f-zip" name="zip" type="text" autocomplete="postal-code" inputmode="numeric" required maxlength="10" pattern="\d{5}(-\d{4})?" aria-describedby="e-zip">
          <p class="error" id="e-zip" data-for="zip"></p>
        </div>

        <div class="field">
          <label for="f-job">Job type <span class="req" aria-hidden="true">*</span></label>
          <select id="f-job" name="job_type" required aria-describedby="e-job_type">
            <option value="">Choose one</option>
            {{{ jobTypeOptions }}}
          </select>
          <p class="error" id="e-job_type" data-for="job_type"></p>
        </div>

        <div class="field">
          <label for="f-weekend">Preferred weekend <span class="req" aria-hidden="true">*</span></label>
          <select id="f-weekend" name="preferred_weekend" required aria-describedby="e-preferred_weekend">
            <option value="">Choose one</option>
            {{{ weekendOptions }}}
          </select>
          <p class="error" id="e-preferred_weekend" data-for="preferred_weekend"></p>
        </div>

        <div class="field">
          <label for="f-photos">Photos of the junk <span class="muted">(optional, up to {{ maxFiles }}, 10 MB each)</span></label>
          <input id="f-photos" name="photos" type="file" accept="image/*" multiple aria-describedby="h-photos e-photos">
          <p class="hint" id="h-photos">Photos help us give an accurate quote.</p>
          <p class="error" id="e-photos" data-for="photos"></p>
        </div>

        <!-- Spam protection: honeypot (hidden from people) + time-to-submit. -->
        <div class="hp" aria-hidden="true">
          <label for="f-website">Leave this empty</label>
          <input id="f-website" name="company_website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <input type="hidden" name="form_started_at" value="">
        <input type="hidden" name="page_url" value="">

        <div class="field check">
          <input id="f-consent" name="sms_consent" type="checkbox" value="yes" required aria-describedby="e-sms_consent">
          <label for="f-consent">{{ consentText }}</label>
          <p class="error" id="e-sms_consent" data-for="sms_consent"></p>
        </div>

        <button class="btn btn-big btn-block" type="submit">Get my free quote</button>
        <p class="fine">By submitting, you agree to our <a href="/privacy">privacy policy</a>. Msg &amp; data rates may apply. Reply STOP to opt out.</p>
      </form>
    </div>
  </div>
</section>
